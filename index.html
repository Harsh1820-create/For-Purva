<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Story – Cinematic Movie</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Playfair+Display:wght@400;600&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
<style>
body, html {
  margin:0; padding:0; width:100%; height:100%;
  overflow:hidden;
  font-family:'Cormorant Garamond', serif;
  background: #000;
  color:white;
}
video#bgvid {
  position:fixed; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:-2;
}
.letterbox {
  position:fixed; left:0; width:100%; height:10%; background:black; z-index:10; pointer-events:none;
}
#topbar { top:0; }
#bottombar { bottom:0; }
.particles {
  position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:5;
  background: url('particles.png') repeat;
  opacity:0.05;
  animation:moveParticles 20s linear infinite;
}
@keyframes moveParticles {0%{background-position:0 0;} 100%{background-position:1000px 1000px;}}
.card {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  text-align:center; width:90%; max-width:900px; z-index:6;
}
#chapter {
  font-family:'Playfair Display', serif; font-size:clamp(36px,6vw,60px); font-weight:700;
  opacity:0; transform:scale(0.8); color:#ffe0e6; text-shadow:0 2px 10px rgba(0,0,0,0.6);
}
#date {
  font-family:'Playfair Display', serif; font-size:clamp(24px,4vw,36px); color:#ffd5dc;
  opacity:0; transform:translateY(-20px); margin-top:1vh; text-shadow:0 2px 6px rgba(0,0,0,0.5);
}
#content {
  font-family:'Dancing Script', serif; font-size:clamp(18px,3.5vw,26px);
  background: rgba(255, 240, 245, 0.85); color:#3b1f2b; border-radius:20px; padding:16px 24px; 
  margin-top:3vh; max-width:90%; opacity:0; transform:translateY(20px); box-shadow:0 8px 20px rgba(0,0,0,0.3);
}
#media img {
  width:100%; max-width:90%; max-height:40vh; object-fit:cover; border-radius:15px;
  margin-top:15px; opacity:0; transform:scale(0.95); transition: all 1.2s ease;
}
#buttons { display:none; margin-top:20px; }
button { padding:12px 28px; border-radius:30px; border:none; font-size:clamp(16px,2vw,20px); margin:8px; cursor:pointer; transition: transform 0.3s ease;}
#yes { background:white; color:#ff5c8a; font-family:'Playfair Display', serif;}
#no { background:rgba(255,255,255,0.2); color:white; font-family:'Playfair Display', serif;}
#yes:hover,#no:hover{transform: scale(1.05);}
#signature { font-size:clamp(20px,2.5vw,26px); margin-top:15px; opacity:0; transform:scale(0.8); font-family:'Playfair Display', serif; transition: all 2s ease;}
</style>
</head>
<body>

<video autoplay muted loop id="bgvid">
  <source src="romantic_sunset.mp4" type="video/mp4">
</video>

<div class="letterbox" id="topbar"></div>
<div class="letterbox" id="bottombar"></div>
<div class="particles"></div>

<div class="card">
  <div id="chapter"></div>
  <div id="date"></div>
  <div id="media"></div>
  <div id="content"></div>
  <div id="buttons">
    <button id="yes" onclick="yes()">Yes ❤️</button>
    <button id="no" onclick="no()">No 🙈</button>
  </div>
  <div id="signature">— From Harsh ❤️</div>
</div>

<script>
const scenes=[
  {chapter:"Chapter 1 – First Contact", date:"21st May 2025", content:"I first sent you a request on Shaadi.com, you rejected it unknowingly. Two months later I sent again, and this time you accepted unknowingly. I thought you won’t respond, so I sent a request on Instagram and you accepted."},
  {chapter:"Chapter 2 – First Conversation", date:"21st May 2025", content:"I said Hey, and you responded Hey. Then you asked, ‘Do we know each other?’ Our conversation started here."},
  {chapter:"Chapter 3 – Confidence & Notes", date:"24th May 2025", content:"Even before being in a relationship, I wrote in my notes that we will get married. I was that sure."},
  {chapter:"Chapter 4 – Long Distance & Trip", date:"9th June 2025", content:"Our conversations were not smooth at first. We had little time to talk, and during your Udaipur trip, our messages stopped completely."},
  {chapter:"Chapter 5 – Heartbreak", date:"15th June 2025", content:"One day after the trip, you messaged me at 12:12 PM that we should not continue. My heart broke. You liked me but were fighting your internal battles."},
  {chapter:"Chapter 6 – Reunion & Flow", date:"22nd June 2025", content:"A week later, you messaged me again. We laughed, cried, fought, and decided to go with the flow."},
  {chapter:"Chapter 7 – Falling in Love", date:"15th July 2025", content:"Over months, we laughed, fought, cried, had serious conversations, and fell in love."},
  {chapter:"Chapter 8 – Families Meet", date:"2nd December 2025", content:"Our families met and it became official. We were finally a couple officially.", image:"family_meeting.jpg"},
  {chapter:"Chapter 9 – First Physical Meeting", date:"14th December 2025", content:"The day we met physically, we hugged, kissed, and were just so happy. Being in each other’s company felt magical.", image:"first_meeting.jpg"},
  {chapter:"Chapter 10 – Engagement & Marriage", date:"20th December 2025", content:"We traveled together, got engaged, and also married. Best time of my life!", image:"engagement.jpg"},
  {chapter:"Chapter 11 – Kite Festival", date:"25th December 2025", content:"We enjoyed the kite festival together, creating memories I’ll cherish forever.", image:"kite_festival.jpg"},
  {final:true}
];

let index=0;
const chapterEl=document.getElementById("chapter");
const dateEl=document.getElementById("date");
const contentEl=document.getElementById("content");
const mediaEl=document.getElementById("media");
const buttons=document.getElementById("buttons");
const signature=document.getElementById("signature");

function showScene(scene){
  chapterEl.style.opacity=0; dateEl.style.opacity=0; contentEl.style.opacity=0; mediaEl.innerHTML="";
  
  setTimeout(()=>{ 
    chapterEl.innerText = scene.chapter;
    chapterEl.style.opacity=1; chapterEl.style.transform="scale(1)";
  },100);
  setTimeout(()=>{ 
    dateEl.innerText = scene.date;
    dateEl.style.opacity=1; dateEl.style.transform="translateY(0)";
  },700);
  setTimeout(()=>{ 
    contentEl.innerText = scene.content;
    contentEl.style.opacity=1; contentEl.style.transform="translateY(0)";
    if(scene.image){
      mediaEl.innerHTML=`<img src="${scene.image}">`;
      const img=mediaEl.querySelector('img');
      setTimeout(()=>{img.style.opacity=1; img.style.transform="scale(1)";},50);
    }
  },1300);
}

document.querySelector(".card").addEventListener("click", ()=>{
  if(index>=scenes.length) return;
  if(scenes[index].final){
    chapterEl.style.opacity=0; dateEl.style.opacity=0; contentEl.style.opacity=0; mediaEl.innerHTML="";
    buttons.style.display="block";
    setTimeout(()=>{buttons.style.opacity=1;},200);
    return;
  }
  showScene(scenes[index]);
  index++;
});

function yes(){ buttons.style.display="none"; signature.style.opacity=1; signature.style.transform="scale(1)"; signature.innerText="Thank you for choosing me — again. Always. — From Harsh ❤️";}
function no(){ alert("This option was never real ❤️"); }
</script>
</body>
</html>
