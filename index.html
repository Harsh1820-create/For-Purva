<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Almost Missed → Forever</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600&display=swap" rel="stylesheet">

<style>
:root {
  --text-size: clamp(20px, 2.4vw, 26px);
}

body {
  margin:0;
  height:100vh;
  background: radial-gradient(circle at top, #ff9aa2, #7b2c3f 60%);
  font-family:'Dancing Script', serif;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.card {
  width:100%;
  height:100%;
  max-width:1100px;
  padding:6vh 6vw;
  box-sizing:border-box;
  position:relative;
}

#date {
  position:absolute;
  top:20px;
  right:30px;
  font-size:14px;
  opacity:0.7;
}

#text {
  font-size:var(--text-size);
  line-height:1.8;
  max-width:900px;
  animation:fadeIn 1s ease;
}

#text::after {
  content:" |";
  animation:blink 1s infinite;
}

@keyframes blink {
  0%,50%{opacity:1;}
  51%,100%{opacity:0;}
}

img {
  width:100%;
  max-height:60vh;
  object-fit:contain;
  margin-top:30px;
  border-radius:20px;
  opacity:0;
  animation:photoFade 5s ease forwards;
}

@keyframes photoFade {
  0%{opacity:0;}
  20%{opacity:1;}
  80%{opacity:1;}
  100%{opacity:0;}
}

#buttons {
  display:none;
  margin-top:40px;
}

button {
  padding:14px 32px;
  border-radius:40px;
  border:none;
  font-size:18px;
  margin:10px;
  cursor:pointer;
}

#yes { background:white; color:#ff5c8a; }
#no { background:rgba(255,255,255,0.2); color:white; }

#signature {
  margin-top:30px;
  font-size:26px;
  opacity:0;
  transition:opacity 2s;
}

.zoom {
  animation:slowZoom 8s ease forwards;
}

@keyframes slowZoom {
  from { transform:scale(1); }
  to { transform:scale(1.08); }
}

@keyframes fadeIn {
  from{opacity:0;}
  to{opacity:1;}
}
</style>
</head>

<body>
<div class="card" onclick="next()">
  <div id="date"></div>
  <div id="text"></div>
  <div id="media"></div>

  <div id="buttons">
    <button id="yes" onclick="yes(event)">Yes ❤️</button>
    <button id="no" onclick="no(event)">No 🙈</button>
  </div>

  <div id="signature">— From Harsh ❤️</div>
</div>

<audio id="music"></audio>

<script>
const scenes = [
  { text:"This story almost never happened…" },

  { text:"I sent you a request on Shaadi.com. You rejected it… unknowingly." },
  { text:"Two months later… you accepted it. Unknowingly again." },

  { date:"24th May 2025", text:"I wrote something in my notes — long before we were together.", note:"We will get married." },

  { text:"We talked from far away. Time was limited. Distance was loud.", image:"photo1.jpg" },

  { date:"9th June 2025", text:"At 12:12 PM… you said we should not take it further." },

  { date:"15th June 2025", text:"A week later… you messaged again. Just one word. Hey." },

  { text:"We decided to go with the flow. And somewhere between laughs, fights and tears… we fell in love." },

  { date:"2nd December 2025", text:"Distance finally ended.", image:"photo2.jpg" },

  { date:"14th December 2025", text:"We travelled. We got engaged. We got married. We lived.", image:"photo3.jpg" },
  { image:"photo4.jpg" },

  { final:true }
];

let index=0, typing=false;
const textEl=document.getElementById("text");
const media=document.getElementById("media");
const dateEl=document.getElementById("date");
const music=document.getElementById("music");

const tracks={
  start:"music1.mp3",
  hope:"music2.mp3",
  forever:"music3.mp3"
};

function play(src){
  if(music.src.includes(src)) return;
  music.src=src;
  music.play();
}

function type(txt, cb){
  typing=true;
  textEl.innerText="";
  let words=txt.split(" "), i=0;
  let t=setInterval(()=>{
    textEl.innerText+=words[i]+" ";
    i++;
    if(i>=words.length){
      clearInterval(t);
      typing=false;
      if(cb)cb();
    }
  },160);
}

function next(){
  if(typing || index>=scenes.length) return;

  const s=scenes[index];
  media.innerHTML="";
  dateEl.innerText=s.date||"";

  if(index===0) play(tracks.start);
  if(index===5) music.pause();
  if(index===6) play(tracks.hope);
  if(index===8) play(tracks.forever);

  if(s.note){
    type(s.text, ()=> type(s.note));
  } else if(s.text){
    type(s.text);
  }

  if(s.image){
    media.innerHTML=`<img src="${s.image}">`;
  }

  if(s.final){
    music.pause();
    textEl.classList.add("zoom");
    type("After every almost… every pause… and every leap of faith…", ()=>{
      setTimeout(()=>{
        type("Will you be my Valentine… again?");
        document.getElementById("buttons").style.display="block";
      },800);
    });
  }

  index++;
}

function yes(e){
  e.stopPropagation();
  document.getElementById("buttons").style.display="none";
  type("Thank you for choosing me — again. Always.", ()=>{
    document.getElementById("signature").style.opacity=1;
  });
}

function no(e){
  e.stopPropagation();
  alert("This option was never real ❤️");
}
</script>
</body>
</html>
