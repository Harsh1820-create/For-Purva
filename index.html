<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Sharvika ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Playfair Display', serif;
  background:
    linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
    url('my_bg.JPEG') center/cover no-repeat;
}

.card {
  background: rgba(255,255,255,0.95);
  width: 80%;
  max-width: 400px;
  padding: 18px 15px;
  border-radius: 18px;
  box-shadow: 0 0 40px rgba(255,105,150,0.3), 0 15px 30px rgba(0,0,0,0.2);
  text-align: center;
  overflow-wrap: break-word;
  position: relative;
  animation: pulseGlow 3s ease-in-out infinite;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 40px rgba(255,105,150,0.3), 0 15px 30px rgba(0,0,0,0.2); }
  50% { box-shadow: 0 0 60px rgba(255,105,150,0.5), 0 15px 30px rgba(0,0,0,0.25); }
}

#dialogue {
  font-size: clamp(14px, 1.9vw, 17px);
  line-height: 1.6;
  color: #3b1f2b;
  min-height: 140px;
  opacity: 0;
  transition: opacity 1s;
  white-space: pre-wrap;
  text-align: center;
  font-style: italic;
}

.glow {
  color: #ff2f6d;
  font-weight: 700;
  font-size: clamp(17px, 2.2vw, 20px);
}

#buttons {
  display: none;
  margin-top: 15px;
  text-align: center;
}

button {
  padding: 7px 18px;
  border: none;
  border-radius: 25px;
  font-size: clamp(12px, 1.7vw, 15px);
  cursor: pointer;
  margin: 5px;
  transition: all 0.3s ease;
}

#yes { background: #ff5c8a; color: white; }
#no { background: #ddd; position: relative; }

#signature {
  margin-top: 12px;
  font-family: 'Dancing Script', cursive;
  font-size: clamp(17px, 2vw, 20px);
  opacity: 0;
  transition: 2s;
  text-align: center;
}

#forever {
  opacity: 0;
  margin-top: 12px;
  font-size: clamp(18px, 2.2vw, 22px);
  font-weight: 700;
  line-height: 1.4;
  color: #ff2f6d;
  text-align: center;
  transition: 2s;
}

@media(max-width:480px){
  .card { padding: 15px 10px; width: 90%; }
  #dialogue { font-size: 14px; min-height: 120px; }
  #forever { font-size: 16px; }
  #signature { font-size: 16px; }
  button { font-size: 13px; padding: 6px 14px; }
}
</style>
</head>

<body>

<audio id="bgMusic" autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="card">
  <div id="dialogue"></div>

  <div id="buttons">
    <button id="yes" onclick="yes()">Yes 🧡</button>
    <button id="no">No 🙈</button>
  </div>

  <div id="signature">— Harsh 🧡</div>

  <div id="forever">
    I am always yours<br>
    Forever and ever and ever...
  </div>
</div>

<script>
// Story from Dad to daughter
const story = [
"Hey Sharvika, this is Dad. I want to tell you our story…",
"I first sent your mom a request on Shaadi.com, and she didn’t accept at first. After two months, I tried again, and she accepted. Then I reached out on Instagram, and she accepted there too!",
"I said 'Hey', and she replied, 'Hey, do we know each other?' That was 21st May 2025. She even unfollowed me back briefly, but soon we started chatting on Instagram and WhatsApp.",
"I wrote in my notes that we would get married, even before our relationship officially began. I was that sure!",
"At first, our conversations were short and tricky, because of the distance. Then your mom went to Udaipur, and our chats stopped completely.",
"One day after her trip, she messaged me saying we shouldn’t continue. My heart broke. She liked me, but she was fighting her own battles.",
"After a week, she messaged again! I was elated. We decided to go with the flow and see where it would lead.",
"We laughed, argued, cried, and shared serious conversations. And slowly, love grew quietly between us.",
"Months passed, our families met, and everything became official.",
"The first time I met your mom in person after long distance was magical — hugs, kisses, and so much happiness.",
"We traveled together, got engaged, married, and went to Goa — walking along beaches, sharing silences, and creating memories. Those 1.5 months were some of the happiest of my life!",
"So Purvaa....",
"Will you be my forever Valentine ?"
];

let i = 0;
const box = document.getElementById("dialogue");
const buttons = document.getElementById("buttons");
const sign = document.getElementById("signature");
const forever = document.getElementById("forever");
const music = document.getElementById("bgMusic");
const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");

document.addEventListener("click",()=>{ if(music.paused) music.play(); });

function typeLine(line, callback){
  let idx = 0;
  box.innerText = '';
  box.style.opacity = 1;
  const interval = setInterval(()=>{
    if(idx < line.length){
      box.innerText += line[idx];
      idx++;
    } else {
      clearInterval(interval);
      setTimeout(callback, 1200);
    }
  }, 80);
}

function showStory(){
  if(i >= story.length) return;
  if(i === story.length - 1){
    typeLine(story[i], ()=>{
      box.classList.add("glow");
      buttons.style.display = "block";
    });
  } else {
    typeLine(story[i], ()=>{
      i++;
      showStory();
    });
  }
}
showStory();

function yes(){
  buttons.style.display="none";
  sign.style.opacity = 1;
  setTimeout(()=>{ forever.style.opacity = 1; }, 1200);
}

noBtn.addEventListener("mouseenter", ()=>{
  const x = Math.random()*120 - 60;
  const y = Math.random()*80 - 40;
  noBtn.style.transform = `translate(${x}px, ${y}px)`;

  yesBtn.style.transform = "scale(1.6)";
  yesBtn.style.boxShadow = "0 0 20px #ff5c8a, 0 0 40px #ff9ab3";
  yesBtn.style.transition = "transform 0.3s ease, box-shadow 0.3s ease";

  setTimeout(()=>{
    yesBtn.style.transform = "scale(1)";
    yesBtn.style.boxShadow = "";
  }, 400);
});
</script>
</body>
</html>
