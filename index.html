<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Love Story – Cinematic</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<style>
html, body {
  margin:0; padding:0; width:100%; height:100%;
  font-family:'Dancing Script', cursive; color:white;
  display:flex; justify-content:center; align-items:center;
  background:url('my_bg.JPEG') center/cover no-repeat;
  overflow:hidden;
}
.card {
  text-align:center;
  max-width:900px;
  width:90%;
  background: rgba(0,0,0,0.5);
  padding:30px 20px;
  border-radius:25px;
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
}
#chapter {
  font-family:'Playfair Display', serif; 
  font-size:clamp(36px,6vw,60px); 
  font-weight:700; 
  color:#ffd6e0;  
  margin-bottom:20px; 
  text-shadow: 2px 2px 15px rgba(0,0,0,0.7); 
  opacity:0; transform:scale(0.8);
  transition: all 1s ease;
}
#dialogue {
  background: rgba(255,240,245,0.9);
  color:#3b1f2b;
  border-radius:20px;
  padding:16px 24px;
  font-size:clamp(18px,3.5vw,26px);
  max-width:90%; margin:0 auto;
  box-shadow:0 8px 20px rgba(0,0,0,0.3);
  opacity:0; transform:translateY(50px);
  transition: all 1s ease;
}
#buttons { 
  display:none; 
  margin-top:50px; 
  position: relative; 
  z-index: 1000; 
}
button { 
  padding:12px 28px; 
  border-radius:30px; 
  border:none; 
  font-size:clamp(16px,2vw,20px); 
  margin:8px; 
  cursor:pointer; 
  transition: transform 0.3s ease;
  z-index: 1000;
}
#yes { background:white; color:#ff5c8a; font-family:'Playfair Display', serif;}
#no { background:rgba(255,255,255,0.2); color:white; font-family:'Playfair Display', serif;}
#yes:hover,#no:hover{transform: scale(1.05);}
#signature { font-size:clamp(20px,2.5vw,26px); margin-top:15px; opacity:0; transform:scale(0.8); transition:all 2s ease; font-family:'Playfair Display', serif; text-align:center;}
.heart { position:absolute; width:30px; height:30px; background:red;
  clip-path: polygon(50% 0%, 100% 35%, 80% 100%, 50% 80%, 20% 100%, 0 35%);
  animation:hearts 2s linear forwards;}
@keyframes hearts { 0%{transform:translateY(0) scale(0.5); opacity:1;} 100%{transform:translateY(-300px) scale(1.2); opacity:0;} }
.no-bubble {
  position: absolute; left: 50%; bottom: 100px; transform: translateX(-50%);
  background: rgba(255,192,203,0.9); color:#800020;
  padding:12px 20px; border-radius:25px;
  font-family:'Playfair Display', serif; font-size:clamp(16px,2vw,20px);
  opacity:0; pointer-events:none;
  box-shadow:0 5px 15px rgba(0,0,0,0.3);
  animation: floatUp 2s ease forwards;
  z-index: 1000;
}
@keyframes floatUp { 0%{transform: translateX(-50%) translateY(0); opacity:1;} 100%{transform: translateX(-50%) translateY(-150px); opacity:0;} }
.heart-bubble {
  position:absolute; width:20px; height:20px; background:red;
  clip-path: polygon(50% 0%,100% 35%,80% 100%,50% 80%,20% 100%,0 35%);
  opacity:0; animation: floatHeart 2s ease forwards;
}
@keyframes floatHeart { 0%{transform:translateY(0) scale(0.5); opacity:1;} 100%{transform:translateY(-150px) scale(1.2); opacity:0;} }
</style>
</head>
<body>

<div class="card">
  <div id="chapter"></div>
  <div id="dialogue"></div>
  <div id="buttons">
    <button id="yes" onclick="yes()">Yes ❤️</button>
    <button id="no" onclick="no()">No 🙈</button>
  </div>
  <div id="signature">— From Harsh ❤️</div>
</div>

<script>
const scenes = [
  {chapter:"Chapter 1 – First Contact", dialogue:"I sent you a request on Shaadi.com, and you rejected it unknowingly. Two months later, I tried again, and you accepted. That tiny ‘accept’ changed my life forever."},
  {chapter:"Chapter 2 – The First Conversation", dialogue:"I nervously typed, ‘Hey.’ You replied, ‘Hey.’ Just a simple greeting, but my heart was racing. Then came your question, ‘Do we know each other?’ My cheeks burned."},
  {chapter:"Chapter 3 – Confidence & Notes", dialogue:"Even before we were officially together, I wrote in my notes: 'We will get married.' It wasn’t arrogance, just certainty. I pictured our wedding, our laughter, our shared life."},
  {chapter:"Chapter 4 – Long Distance & Udaipur Trip", dialogue:"Time zones and distance stretched the days painfully. During your Udaipur trip, messages stopped, and I felt an ache I hadn’t known before. Every night, I whispered a silent wish that we would find our way back."},
  {chapter:"Chapter 5 – Heartbreak", dialogue:"Then one day at exactly 12:12 PM, your message arrived: we shouldn’t continue. My heart shattered. It felt like losing a part of myself I had only just discovered."},
  {chapter:"Chapter 6 – Reunion & Going with the Flow", dialogue:"A week later, your message arrived again. We decided to let life take its course — laugh, cry, fight, and grow together. Every moment with you felt precious."},
  {chapter:"Chapter 7 – Falling in Love", dialogue:"Months passed. We laughed until our cheeks hurt, fought over silly things, shared secrets under moonlight, and cried when words couldn’t express our feelings. Love isn’t perfect, but it’s ours."},
  {chapter:"Chapter 8 – Families Meet", dialogue:"The day our families met was surreal. Warm smiles, curious glances, quiet laughter — yet underneath, there was acceptance. Our love felt validated, embraced, and blessed."},
  {chapter:"Chapter 9 – First Physical Meeting", dialogue:"Meeting you for the first time, finally in person, felt like coming home. The hug lingered, the kiss was gentle, and I felt the electric charge of connection."},
  {chapter:"Chapter 10 – Engagement & Marriage", dialogue:"From traveling together, to getting engaged, and then marrying — every moment felt like a dream. From small breakfasts to chaotic preparations, every memory was a treasure."},
  {chapter:"Chapter 11 – Our First Trip Together", dialogue:"Our first trip together was to Goa. Hand in hand, we walked along sunlit beaches, the waves kissing our feet. We laughed, explored, got lost in narrow lanes, and made memories that would forever be ours."},
  {chapter:"Chapter 12 – Build-up", dialogue:"So, Purva… after all these moments we’ve shared, after all the laughter, tears, and memories…", final:false},
  {chapter:"Chapter 13 – A Special Question", dialogue:"Will you be my Valentine?", final:true}
];

let index=0;
const chapterEl=document.getElementById("chapter");
const dialogueEl=document.getElementById("dialogue");
const buttons=document.getElementById("buttons");
const signature=document.getElementById("signature");

function fadeIn(el){ el.style.opacity=1; el.style.transform="scale(1) translateY(0)"; }
function fadeOut(el){ el.style.opacity=0; el.style.transform="scale(0.8) translateY(50px)"; }

function showScene(scene){
  chapterEl.innerText = scene.chapter || "";
  dialogueEl.innerText = scene.dialogue || "";
  chapterEl.style.opacity=0; chapterEl.style.transform="scale(0.8)";
  dialogueEl.style.opacity=0; dialogueEl.style.transform="translateY(50px)";
  fadeIn(chapterEl);
  setTimeout(()=>fadeIn(dialogueEl),800);
}

function runScenes(){
  if(index >= scenes.length) return;
  const scene = scenes[index];
  if(scene.final){
    // Keep card visible
    showScene(scene);
    setTimeout(()=>{
      buttons.style.display = "block";
      fadeIn(buttons);
    },1000);
    return;
  }
  showScene(scene);
  index++;
  setTimeout(runScenes,7000);
}

window.onload=function(){
  showScene(scenes[index]);
  index++;
  setTimeout(runScenes,7000);
}

const playfulMessages=[
  "Oops! This was never an option 😉",
  "Try again, my heart belongs to you ❤️",
  "No? Are you kidding me? 😜",
  "This is a trick, right? 😘",
  "Nice try! But yes is the only answer 😏",
  "Love doesn't accept 'No' here ❤️"
];

function yes(){
  buttons.style.display="none";
  fadeIn(signature);
  signature.innerText="Thank you for choosing me — always. — From Harsh ❤️";
  for(let i=0;i<20;i++){
    const heart=document.createElement("div"); 
    heart.className="heart";
    heart.style.left=Math.random()*90 + "%";
    heart.style.bottom="0px";
    heart.style.animationDuration=(1+Math.random()*2) + "s";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),3000);
  }
}

function no(){
  const message=playfulMessages[Math.floor(Math.random()*playfulMessages.length)];
  const bubble=document.createElement("div");
  bubble.className="no-bubble";
  bubble.innerText=message;
  document.body.appendChild(bubble);
  setTimeout(()=>bubble.remove(),2000);
  for(let i=0;i<5;i++){
    const heart=document.createElement("div");
    heart.className="heart-bubble";
    heart.style.left=50+(Math.random()*60-30)+"%";
    heart.style.bottom=100+Math.random()*20+"px";
    heart.style.animationDuration=(1+Math.random())+"s";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),2000);
  }
}
</script>
</body>
</html>
