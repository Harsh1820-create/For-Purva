<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Story – Cinematic & Animated</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
<style>
body, html {
  margin:0; padding:0;
  width:100%; height:100%;
  font-family:'Cormorant Garamond', serif;
  background: url('romantic_background.jpg') center/cover no-repeat;
  display:flex; justify-content:center; align-items:center;
  overflow:hidden; position:relative; color:white;
}

body::before {
  content:""; position:absolute; top:0; left:0; width:100%; height:100%;
  background: rgba(0,0,0,0.35); z-index:0;
}

body::after {
  content:""; position:absolute; top:0; left:0; width:100%; height:100%;
  background: url('grain.png') repeat; opacity:0.08; z-index:1;
  pointer-events:none;
}

.particles {
  position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:2;
  background: url('particles.png') repeat;
  opacity:0.05;
  animation:moveParticles 20s linear infinite;
}
@keyframes moveParticles {0%{background-position:0 0;} 100%{background-position:1000px 1000px;}}

.card {
  position:relative; width:90%; max-width:800px; text-align:center; z-index:3;
}

#chapter {
  font-family:'Playfair Display', serif;
  font-size:clamp(32px,6vw,52px); font-weight:600;
  letter-spacing:1px; opacity:0; transform: scale(0.8); transition: all 0.8s ease;
  text-shadow: 0 2px 8px rgba(0,0,0,0.6);
}

#date {
  font-size:clamp(20px,4vw,32px); font-weight:500; margin-top:1vh;
  opacity:0; transform: translateY(-20px); transition: all 0.8s ease;
  letter-spacing:0.5px;
}

#content {
  font-size:clamp(18px,3.5vw,26px); background: rgba(255,255,255,0.9); color:#000;
  border-radius:15px; padding:12px 18px; margin-top:3vh; max-width:90%;
  opacity:0; transform: translateY(20px); transition: all 0.8s ease;
  font-family:'Cormorant Garamond', serif;
}

#media img {
  width:100%; max-width:90%; max-height:40vh; object-fit:contain; border-radius:15px;
  margin-top:15px; opacity:0; transform: scale(0.95); transition: all 1.2s ease;
}

#buttons { display:none; margin-top:20px; }
button { padding:12px 28px; border-radius:30px; border:none; font-size:clamp(16px,2vw,20px); margin:8px; cursor:pointer; transition: transform 0.3s ease; }
#yes { background:white; color:#ff5c8a; font-family:'Playfair Display', serif;}
#no { background:rgba(255,255,255,0.2); color:white; font-family:'Playfair Display', serif;}
#yes:hover,#no:hover{transform: scale(1.05);}

#signature { font-size:clamp(20px,2.5vw,26px); margin-top:15px; opacity:0; transition: all 2s ease; font-family:'Playfair Display', serif; transform: scale(0.8);}
</style>
</head>
<body>
<div class="particles"></div>

<div class="card">
  <div id="chapter"></div>
  <div id="date"></div>
  <div id="media"></div>
  <div id="content"></div>
  <div id="buttons">
    <button id="yes" onclick="yes()">Yes ❤️</button>
    <button id="no" onclick="no()">No 🙈</button>
  </div>
  <div id="signature">— From Harsh ❤️</div>
</div>

<script>
const scenes=[
  {chapter:"Chapter 1 – Beginning", date:"21st May 2025", content:"Hey! We started talking on Insta and WhatsApp."},
  {chapter:"Chapter 2 – Distance", date:"24th May 2025", content:"It was confusing at first, but I knew we would be together."},
  {chapter:"Chapter 3 – Heartbreak", date:"9th June 2025", content:"She said we shouldn't continue… my heart broke 😢"},
  {chapter:"Chapter 4 – Hope Returns", date:"15th June 2025", content:"A week later, she reached out… we decided to go with the flow ❤️"},
  {chapter:"Chapter 5 – First Meeting", date:"2nd December 2025", content:"Finally meeting in person! So happy 😍", image:"photo2.jpg"},
  {chapter:"Chapter 6 – Forever", date:"14th December 2025", content:"We got engaged, married, and celebrated together.", image:"photo3.jpg"},
  {final:true}
];

let index=0, step=0;

const chapterEl=document.getElementById("chapter");
const dateEl=document.getElementById("date");
const contentEl=document.getElementById("content");
const mediaEl=document.getElementById("media");
const buttons=document.getElementById("buttons");
const signature=document.getElementById("signature");

function nextStep(){
  if(index>=scenes.length) return;
  const s=scenes[index];

  if(s.final){
    chapterEl.style.opacity=0; dateEl.style.opacity=0; contentEl.style.opacity=0; mediaEl.innerHTML="";
    buttons.style.display="block";
    buttons.style.opacity=0;
    setTimeout(()=>{buttons.style.opacity=1;},200);
    return;
  }

  if(step===0){
    chapterEl.innerText=s.chapter;
    chapterEl.style.opacity=1; chapterEl.style.transform="scale(1)";
    step++;
  } else if(step===1){
    dateEl.innerText=s.date;
    dateEl.style.opacity=1; dateEl.style.transform="translateY(0)";
    step++;
  } else if(step===2){
    contentEl.innerText=s.content;
    contentEl.style.opacity=1; contentEl.style.transform="translateY(0)";
    if(s.image){
      mediaEl.innerHTML=`<img src="${s.image}">`;
      const img=mediaEl.querySelector('img');
      setTimeout(()=>{img.style.opacity=1; img.style.transform="scale(1)";},50);
    }
    step=0;
    index++;
  }
}

document.querySelector(".card").addEventListener("click", nextStep);

function yes(){ buttons.style.display="none"; signature.style.opacity=1; signature.style.transform="scale(1)"; signature.innerText="Thank you for choosing me — again. Always. — From Harsh ❤️";}
function no(){ alert("This option was never real ❤️"); }
</script>
</body>
</html>
