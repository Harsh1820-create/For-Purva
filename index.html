<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Love Story – Interactive Movie</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Playfair+Display:wght@400;700&family=Cormorant+Garamond:wght@400;700&display=swap" rel="stylesheet">
<style>
html, body {
  margin:0; padding:0; width:100%; height:100%;
  overflow:hidden; font-family:'Dancing Script', cursive; background:#000; color:white;
}
#background {
  position:absolute; top:0; left:0; width:100%; height:100%;
  background-size:cover; background-position:center; z-index:-1; transition: background 1s ease-in-out;
}
.card {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:90%; max-width:900px; text-align:center; z-index:2;
}
#chapter {
  font-family:'Playfair Display', serif; font-size:clamp(36px,6vw,60px); font-weight:700;
  color:#ffe0e6; opacity:0; transition: all 0.8s ease;
  text-shadow:0 2px 10px rgba(0,0,0,0.6); margin-bottom:10px;
}
#date {
  font-family:'Cormorant Garamond', serif; font-size:clamp(24px,4vw,36px);
  color:#ffd5dc; opacity:0; transition: all 0.8s ease;
  text-shadow:0 2px 6px rgba(0,0,0,0.5); margin-bottom:20px;
}
#dialogue {
  background: rgba(255, 240, 245, 0.85);
  color: #3b1f2b;
  border-radius:20px; padding:16px 24px;
  font-size:clamp(18px,3.5vw,26px);
  max-width:90%; margin:0 auto; opacity:0; transition: all 0.8s ease;
  box-shadow:0 8px 20px rgba(0,0,0,0.3);
}
#photo {
  margin-top:15px; opacity:0; max-width:90%; border-radius:15px; transition: all 1s ease;
}
#buttons { display:none; margin-top:20px; }
button {
  padding:12px 28px; border-radius:30px; border:none;
  font-size:clamp(16px,2vw,20px); margin:8px; cursor:pointer;
  transition: transform 0.3s ease;
}
#yes { background:white; color:#ff5c8a; font-family:'Playfair Display', serif;}
#no { background:rgba(255,255,255,0.2); color:white; font-family:'Playfair Display', serif;}
#yes:hover,#no:hover{transform: scale(1.05);}
#signature { font-size:clamp(20px,2.5vw,26px); margin-top:15px; opacity:0; transform:scale(0.8); transition: all 2s ease; font-family:'Playfair Display', serif;}
/* Hearts Animation */
@keyframes hearts {
  0%{transform:translateY(0) scale(0.5); opacity:1;}
  100%{transform:translateY(-300px) scale(1.2); opacity:0;}
}
.heart {
  position:absolute; width:30px; height:30px; background:red; clip-path: polygon(50% 0%, 100% 35%, 80% 100%, 50% 80%, 20% 100%, 0 35%);
  animation:hearts 2s linear forwards;
}
</style>
</head>
<body>

<div id="background"></div>
<div class="card">
  <div id="chapter"></div>
  <div id="date"></div>
  <div id="dialogue"></div>
  <img id="photo" src="">
  <div id="buttons">
    <button id="yes" onclick="yes()">Yes ❤️</button>
    <button id="no" onclick="no()">No 🙈</button>
  </div>
  <div id="signature">— From Harsh ❤️</div>
</div>

<audio id="bgMusic" loop>
  <source src="bollywood_song.mp3" type="audio/mpeg">
</audio>

<script>
const scenes = [
  {chapter:"Chapter 1 – First Contact", date:"21st May 2025", dialogue:"I first sent you a request on Shaadi.com, you rejected it unknowingly. Two months later I sent again, and this time you accepted unknowingly. I thought you won’t respond, so I sent a request on Instagram and you accepted.", bg:"bg1.jpg"},
  {chapter:"Chapter 2 – First Conversation", date:"21st May 2025", dialogue:"I said Hey, and you responded Hey. Then you asked, ‘Do we know each other?’ Our conversation started here.", bg:"bg2.jpg"},
  {chapter:"Chapter 3 – Confidence & Notes", date:"24th May 2025", dialogue:"Even before being in a relationship, I wrote in my notes that we will get married. I was that sure.", bg:"bg3.jpg"},
  {chapter:"Chapter 4 – Long Distance & Trip", date:"9th June 2025", dialogue:"Our conversations were not smooth at first. We had little time to talk, and during your Udaipur trip, our messages stopped completely.", bg:"bg4.jpg"},
  {chapter:"Chapter 5 – Heartbreak", date:"15th June 2025", dialogue:"One day after the trip, you messaged me at 12:12 PM that we should not continue. My heart broke. You liked me but were fighting your internal battles.", bg:"bg5.jpg"},
  {chapter:"Chapter 6 – Reunion & Flow", date:"22nd June 2025", dialogue:"A week later, you messaged me again. We laughed, cried, fought, and decided to go with the flow.", bg:"bg6.jpg"},
  {chapter:"Chapter 7 – Falling in Love", date:"15th July 2025", dialogue:"Over months, we laughed, fought, cried, had serious conversations, and fell in love.", bg:"bg7.jpg"},
  {chapter:"Chapter 8 – Families Meet", date:"2nd December 2025", dialogue:"Our families met and it became official. We were finally a couple officially.", bg:"bg8.jpg", photo:"family_meeting.jpg"},
  {chapter:"Chapter 9 – First Physical Meeting", date:"14th December 2025", dialogue:"The day we met physically, we hugged, kissed, and were just so happy. Being in each other’s company felt magical.", bg:"bg9.jpg", photo:"first_meeting.jpg"},
  {chapter:"Chapter 10 – Engagement & Marriage", date:"20th December 2025", dialogue:"We traveled together, got engaged, and also married. Best time of my life!", bg:"bg10.jpg", photo:"engagement.jpg"},
  {chapter:"Chapter 11 – Kite Festival", date:"25th December 2025", dialogue:"We enjoyed the kite festival together, creating memories I’ll cherish forever.", bg:"bg11.jpg", photo:"kite_festival.jpg"},
  {final:true}
];

let index = 0;
const chapterEl = document.getElementById("chapter");
const dateEl = document.getElementById("date");
const dialogueEl = document.getElementById("dialogue");
const photoEl = document.getElementById("photo");
const bgEl = document.getElementById("background");
const buttons = document.getElementById("buttons");
const signature = document.getElementById("signature");
const music = document.getElementById("bgMusic");

function showScene(scene){
  chapterEl.style.opacity=0; dateEl.style.opacity=0; dialogueEl.style.opacity=0; photoEl.style.opacity=0;
  if(scene.bg) bgEl.style.background = `url(${scene.bg}) center/cover no-repeat`;
  
  if(music.paused){ music.play(); }

  setTimeout(()=>{chapterEl.innerText = scene.chapter; chapterEl.style.opacity=1;},100);
  setTimeout(()=>{dateEl.innerText = scene.date; dateEl.style.opacity=1;},700);
  setTimeout(()=>{
    dialogueEl.innerText = scene.dialogue; dialogueEl.style.opacity=1;
    if(scene.photo){ photoEl.src = scene.photo; photoEl.style.opacity=1; }
  },1300);
}

document.querySelector(".card").addEventListener("click", ()=>{
  if(index >= scenes.length) return;
  if(scenes[index].final){
    chapterEl.style.opacity=0; dateEl.style.opacity=0; dialogueEl.style.opacity=0; photoEl.style.opacity=0;
    buttons.style.display="block"; setTimeout(()=>{buttons.style.opacity=1;},200);
    return;
  }
  showScene(scenes[index]); index++;
});

function yes(){
  buttons.style.display="none"; signature.style.opacity=1;
  signature.innerText="Thank you for choosing me — again. Always. — From Harsh ❤️";
  for(let i=0;i<20;i++){
    const heart=document.createElement("div"); heart.className="heart";
    heart.style.left=Math.random()*90+"%"; heart.style.bottom="0px"; heart.style.animationDuration=(1+Math.random()*2)+"s";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),3000);
  }
}
function no(){ alert("This option was never real ❤️"); }
</script>

</body>
</html>
