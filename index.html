<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Purva ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">

<style>
/* Global styles */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Playfair Display', serif;
  background:
    linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
    url('my_bg.JPEG') center/cover no-repeat;
}

/* Card styling with pulsing glow */
.card {
  background: rgba(255,255,255,0.95);
  width: 90%;
  max-width: 500px;
  padding: 22px 18px;
  border-radius: 18px;
  box-shadow: 0 0 40px rgba(255,105,150,0.3), 0 15px 30px rgba(0,0,0,0.2);
  text-align: center;
  overflow-wrap: break-word;
  position: relative;
  animation: pulseGlow 3s ease-in-out infinite;
}

/* Pulse glow animation */
@keyframes pulseGlow {
  0%, 100% {
    box-shadow: 0 0 40px rgba(255,105,150,0.3), 0 15px 30px rgba(0,0,0,0.2);
  }
  50% {
    box-shadow: 0 0 60px rgba(255,105,150,0.5), 0 15px 30px rgba(0,0,0,0.25);
  }
}

/* Story text */
#dialogue {
  font-size: clamp(14px, 2vw, 18px);
  line-height: 1.6;
  color: #3b1f2b;
  min-height: 160px;
  opacity: 0;
  transition: opacity 1s;
  white-space: pre-wrap;
  text-align: center;
  font-style: italic;
}

/* Glow for final line */
.glow {
  color: #ff2f6d;
  font-weight: 700;
  font-size: clamp(18px, 2.5vw, 22px);
}

/* Buttons */
#buttons {
  display: none;
  margin-top: 18px;
}

button {
  padding: 8px 20px;
  border: none;
  border-radius: 25px;
  font-size: clamp(13px, 1.8vw, 16px);
  cursor: pointer;
  margin: 6px;
  transition: all 0.3s ease;
}

#yes { background: #ff5c8a; color: white; }
#no { background: #ddd; position: relative; }

/* Signature */
#signature {
  margin-top: 15px;
  font-family: 'Dancing Script', cursive;
  font-size: clamp(18px, 2.2vw, 22px);
  opacity: 0;
  transition: 2s;
}

/* Forever message */
#forever {
  opacity: 0;
  margin-top: 15px;
  font-size: clamp(20px, 2.5vw, 24px);
  font-weight: 700;
  line-height: 1.4;
  color: #ff2f6d;
  text-align: center;
  transition: 2s;
}

/* Responsive adjustments */
@media(max-width:480px){
  .card { padding: 18px 12px; }
  #dialogue { font-size: 15px; min-height: 140px; }
  #forever { font-size: 18px; }
  #signature { font-size: 18px; }
  button { font-size: 14px; padding: 7px 16px; }
}
</style>
</head>

<body>

<!-- Background Music -->
<audio id="bgMusic" autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="card">
  <div id="dialogue"></div>

  <div id="buttons">
    <button id="yes" onclick="yes()">Yes ❤️</button>
    <button id="no">No 🙈</button>
  </div>

  <div id="signature">— Always yours, Harsh ❤️</div>

  <div id="forever">
    I am always yours<br>
    Forever and ever and ever
  </div>
</div>

<script>
// Story content
const story = [
"Harsh first sent Purva a request on Shaadi.com, and she rejected it unknowingly. After two months, he sent her again, and this time she accepted unknowingly. Thinking she might not respond there, he sent her a request on Instagram, which she accepted.",
"Harsh first said, ‘Hey.’ Purva replied, ‘Hey, do we know each other?’ It was 21st May 2025. She unfollowed him back. Soon, conversations began on Instagram and WhatsApp.",
"Harsh wrote in his notes that they would get married even before they were officially in a relationship. He was that sure.",
"At first, conversations were not smooth. Distance made time scarce. Then Purva went to Udaipur, and communication stopped completely.",
"One day after the trip, at exactly 12:12 PM, Purva messaged that they should not take it further. His heart broke. She liked him, but her internal battles were stronger.",
"Harsh thought it was the end. Then, after a week, she messaged again. He was elated. They decided to go with the flow.",
"They laughed, fought, cried, and had difficult conversations. Somewhere in between, love quietly found its place.",
"Months passed. Families met. Everything became official.",
"Their first physical meeting after long distance was magical — hugs, kisses, and the comfort of finally being together.",
"They traveled, got engaged, married, and went to Goa together — walking along beaches, sharing silences, creating memories. It was the best 1.5 months of Harsh’s life.",
"So Purva… after everything…",
"Will you be my Valentine?"
];

let i = 0;
const box = document.getElementById("dialogue");
const buttons = document.getElementById("buttons");
const sign = document.getElementById("signature");
const forever = document.getElementById("forever");
const music = document.getElementById("bgMusic");
const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");

// Start music on mobile
document.addEventListener("click",()=>{ if(music.paused) music.play(); });

// Slow typewriter animation
function typeLine(line, callback){
  let idx = 0;
  box.innerText = '';
  box.style.opacity = 1;
  const interval = setInterval(()=>{
    if(idx < line.length){
      box.innerText += line[idx];
      idx++;
    } else {
      clearInterval(interval);
      setTimeout(callback, 1200);
    }
  }, 80); // slow typing
}

// Show story sequentially
function showStory(){
  if(i >= story.length) return;
  if(i === story.length - 1){
    typeLine(story[i], ()=>{
      box.classList.add("glow");
      buttons.style.display = "block";
    });
  } else {
    typeLine(story[i], ()=>{
      i++;
      showStory();
    });
  }
}
showStory();

// Yes button click
function yes(){
  buttons.style.display="none";
  sign.style.opacity = 1;
  setTimeout(()=>{ forever.style.opacity = 1; }, 1200);
}

// No button playful hover
noBtn.addEventListener("mouseenter", ()=>{
  // Move No button randomly
  const x = Math.random()*150 - 75;
  const y = Math.random()*100 - 50;
  noBtn.style.transform = `translate(${x}px, ${y}px)`;

  // Make Yes button grow and glow
  yesBtn.style.transform = "scale(1.6)";
  yesBtn.style.boxShadow = "0 0 20px #ff5c8a, 0 0 40px #ff9ab3";
  yesBtn.style.transition = "transform 0.3s ease, box-shadow 0.3s ease";

  // Return to normal after 400ms
  setTimeout(()=>{
    yesBtn.style.transform = "scale(1)";
    yesBtn.style.boxShadow = "";
  }, 400);
});
</script>
</body>
</html>
